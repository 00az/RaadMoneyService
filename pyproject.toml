[project]
name = "raad-money-service"
version = "0.1.0"
description = "RAAD C1 money API, ledger and wallet directory"
requires-python = ">=3.12,<3.13"
dependencies = ["aws-cdk-lib>=2.180,<3", "constructs>=10,<11", "boto3>=1.35,<2", "PyJWT[crypto]>=2.10,<3", "requests>=2.32,<3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "hypothesis>=6.120,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "moto[dynamodb]>=5.0,<6",
    "cdk-nag>=2.35,<3",
    "openapi-spec-validator>=0.7,<1",
    "pip-audit>=2.7,<3",
    "boto3-stubs>=1.44.3",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raad_money"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=raad_money --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["raad_money"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["raad_money"]
